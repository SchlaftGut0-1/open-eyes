<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'">
<title>New tab</title>
<link rel="stylesheet" href="newtab.css">
</head>
<body>
<main>
  <img class="mark" src="../ui/icon.svg" alt="" width="56" height="56">
  <p id="greeting" class="greeting">Hello</p>
  <h1>Where to?</h1>
  <button id="box" class="box" type="button">
    <i data-lucide="search" aria-hidden="true"></i>
    <span>Search or type an address</span>
    <kbd>Ctrl L</kbd>
  </button>
  <p class="hint">Your agents work in their own spaces, beside you. Open the agent panel with the eye at the top right.</p>
</main>
<script src="../../node_modules/lucide/dist/umd/lucide.min.js"></script>
<script src="newtab.js"></script>
</body>
</html>
