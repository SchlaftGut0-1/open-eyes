# Publishes a GitHub release when a version tag is pushed, after the release branch
# has been merged into main:
#
#   git switch main && git pull
#   git tag -a v1.2.3 -m "open-eyes 1.2.3" && git push origin v1.2.3
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the build provenance
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # to check that the tag is on main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Check the tag is on main and matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag $GITHUB_REF_NAME is not on main; merge the release branch first"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          OPEN_EYES_BROWSER: google-chrome-stable

      - name: Pack
        id: pack
        run: |
          file="$(npm pack --silent)"
          sha256sum "$file" > "$file.sha256"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.file }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          FILE: ${{ steps.pack.outputs.file }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          # Attach the provenance to the release itself, so tools that only look at release
          # assets (such as OpenSSF Scorecard) find it: the full Sigstore bundle, and its
          # signed in-toto statement in the usual SLSA .intoto.jsonl form.
          cp "$BUNDLE" "$FILE.sigstore.json"
          jq -c .dsseEnvelope "$BUNDLE" > "$FILE.intoto.jsonl"

          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          cat >> notes.md <<EOF

          ## Install

          Download \`$FILE\` below, then \`npm install -g ./$FILE\`. Requires Node.js 22+ and a
          Chromium-based browser. Verify where it was built with
          \`gh attestation verify $FILE --repo $GITHUB_REPOSITORY\`, or offline with the attached
          bundle: \`gh attestation verify $FILE --bundle $FILE.sigstore.json --repo $GITHUB_REPOSITORY\`.
          EOF
          # A pre-release version (1.2.3-beta.1) must not become the "Latest" release.
          prerelease=()
          if [[ "$version" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" "$FILE" "$FILE.sha256" "$FILE.sigstore.json" "$FILE.intoto.jsonl" "${prerelease[@]}" \
            --title "open-eyes $version" --notes-file notes.md --verify-tag
